<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Subtle grid lines for dev aesthetic -->
  <line x1="20" y1="64" x2="108" y2="64" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="64" y1="20" x2="64" y2="108" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Code Brackets & Monogram -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 38 46 L 24 64 L 38 82" fill="none" stroke="url(#neonGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Monogram AS in center -->
    <text x="64" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">AS</text>
    
    <!-- Right Bracket > -->
    <path d="M 90 46 L 104 64 L 90 82" fill="none" stroke="url(#neonGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Active indicator dot (pulse) -->
  <circle cx="106" cy="22" r="6" fill="#10b981"/>
  <circle cx="106" cy="22" r="10" fill="#10b981" opacity="0.3"/>
</svg>